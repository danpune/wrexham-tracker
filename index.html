<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wrexham Tracker — Championship 2026/27</title>
<meta name="description" content="Wrexham AFC tracker: every fixture in your timezone, live Championship table, match stats, promotion odds, news and podcasts.">
<meta name="theme-color" content="#e01e2d">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' https: data:; media-src https:; frame-src https://www.youtube-nocookie.com; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta property="og:title" content="Wrexham Tracker">
<meta property="og:description" content="Every fixture in your timezone, the live table, match stats and promotion odds. Free, no ads.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://danpune.github.io/wrexham-tracker/">
<meta property="og:image" content="https://danpune.github.io/wrexham-tracker/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://danpune.github.io/wrexham-tracker/preview.jpg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Wrexham">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e0242f'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'%3EW%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Light by default, the way ESPN and most club sites read. */
  --bg:#f2f4f6; --panel:#fff; --panel2:#eaedf1; --line:#dde2e8;
  --tx:#12161a; --mut:#5c6570; --red:#c8102e; --red-dim:#f0b8bf;
  --w:#1a7f37; --d:#5c6570; --l:#c8102e;
  --chip:rgba(0,0,0,.05);          /* backing behind crests */
  --neutral:#b6bec7;               /* the "other team" half of a stat bar */
  --pill-d:#6b7480;                /* pill backgrounds carry white text, so they are   */
  --pill-w:#1a7f37;                /* split from the --w/--l text colours and stay fixed */
  --pill-l:#c8102e;                /* across both themes                                 */
  --navbg:rgba(242,244,246,.93);
  --cup-bg:#fff6e0; --cup-tx:#8a6100; --cup-line:#efd79a;
  --nextbg:linear-gradient(180deg,#fff2f3,var(--panel));
  --shadow:0 1px 2px rgba(16,24,40,.06);
  --pad:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0f12; --panel:#15181d; --panel2:#1b1f26; --line:#262b33;
    --tx:#e9ecf1; --mut:#8b929e; --red:#f26670; --red-dim:#7a1a20;
    --w:#3fb950; --d:#8b929e; --l:#f26670;
    --chip:rgba(255,255,255,.09);
    --neutral:#4a5058; --pill-d:#4a5058;
    --navbg:rgba(13,15,18,.93);
    --cup-bg:#241f10; --cup-tx:#ffd166; --cup-line:#4a3d1a;
    --nextbg:linear-gradient(180deg,#1c1418,var(--panel));
    --shadow:none;
  }
}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--tx);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap,.tabs{max-width:720px;margin:0 auto;padding:0 var(--pad)}


a{color:inherit;text-decoration:none}

/* header */
header{border-bottom:1px solid var(--line)}
.band{background:linear-gradient(160deg,#e01e2d 0%,#b30d24 55%,#8d0a1e 100%);
  color:#fff;padding:calc(20px + env(safe-area-inset-top)) 0 16px}
.mark{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.mark h1{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.mark h1 span{color:#ffd166}
.story{font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.86);margin-top:8px;max-width:34em}
.bandgrid .right{flex:1 1 auto;min-width:220px;max-width:420px}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:3px 9px}
.tzwrap{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-bottom:10px}
.tzwrap label{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:rgba(255,255,255,.8);white-space:nowrap}
#tz{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);
  border-radius:8px;padding:6px 8px;font-size:12px;font-family:inherit;max-width:190px;
  min-height:32px}
#tz option{color:#12161a;background:#fff}
.mpick label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--mut);margin-bottom:6px}
td.own{cursor:pointer}
td.own:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.mpick select{width:100%;background:var(--panel2);color:var(--tx);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;min-height:44px}
@media(max-width:999px){.tzwrap{justify-content:flex-start;margin:12px 0 4px}}
.progline{display:flex;justify-content:space-between;gap:10px;margin-top:7px;
  font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:rgba(255,255,255,.82)}

/* hero: the two things a fan actually opened this for */
.sbar{height:5px;background:rgba(0,0,0,.28);border-radius:3px;margin-top:14px;overflow:hidden}
.sbar i{display:block;height:100%;background:#ffd166;border-radius:3px;width:0;transition:width .6s ease}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 16px}
.hero3{display:none}
@media(min-width:1000px){.hero3{display:block}}
.mini{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:8px}
.mini td{padding:6px 0;border-top:1px solid var(--line)}
.mini td:first-child{width:22px;color:var(--mut);font-size:11px}
.mini td:nth-child(2){width:100%;font-weight:600}
.mini td:last-child{text-align:right;font-weight:700}
.mini tr.me td{background:rgba(200,16,46,.09)}
.mini tr.me td:nth-child(2){box-shadow:inset 3px 0 0 var(--red)}
.mini tr.cut td{border-top:2px solid var(--red-dim)}
.formcell{white-space:nowrap;text-align:right}
.fp{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:4px;
  font-size:10px;font-weight:800;color:#fff;margin-left:3px;cursor:pointer;vertical-align:middle}
.fp.W{background:var(--pill-w)} .fp.D{background:var(--pill-d)} .fp.L{background:var(--pill-l)}
.fp:focus-visible{outline:2px solid var(--tx);outline-offset:1px}
#tip{position:fixed;z-index:60;background:var(--tx);color:var(--panel);font-size:12px;
  font-weight:600;padding:7px 10px;border-radius:8px;pointer-events:none;opacity:0;
  transition:opacity .12s;max-width:70vw;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tip.on{opacity:1}
@media(max-width:520px){.hero{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.card h2{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin-bottom:9px}
.score{font-size:46px;font-weight:800;letter-spacing:-2.5px;line-height:1}
.sline{display:flex;align-items:center;gap:12px;margin:2px 0 4px}
.sline .crest{width:40px;height:40px;flex:0 0 40px;border-radius:9px;padding:3px}
.vs{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}
.opp{color:var(--mut);font-size:14px;margin-top:4px}
.count{display:flex;align-items:baseline;gap:14px;color:var(--red);line-height:1}
.count b{font-size:38px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.count i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--mut);margin-left:3px}
.count.soon b{font-size:44px}
.count.live b{color:var(--w)}
.cdtag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;color:#fff;background:var(--red);border-radius:999px;
  padding:3px 9px;vertical-align:3px;margin-left:2px}
.cdtag.tmr{background:var(--pill-d)}
.next-when{color:var(--red);font-size:13px;font-weight:600;margin-top:5px}

/* form pills */
.form{display:flex;gap:5px;margin-top:12px}
.pill{width:27px;height:27px;border-radius:7px;display:grid;place-items:center;
  font-size:13px;font-weight:800;color:#fff}
.pill.W{background:var(--pill-w)} .pill.D{background:var(--pill-d)} .pill.L{background:var(--pill-l)}

/* tabs */
nav{position:sticky;top:0;z-index:9;background:var(--navbg);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:4px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 auto;padding:0 var(--pad)}
.tabs::-webkit-scrollbar{display:none}
@media(max-width:430px){.tabs{mask-image:linear-gradient(90deg,#000 88%,transparent)}}
.tab{flex:0 0 auto;padding:13px 10px;font-size:13.5px;font-weight:600;color:var(--mut);
  border-bottom:2px solid transparent;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;font-family:inherit}
.tab[aria-selected=true]{color:var(--tx);border-bottom-color:var(--red)}

section{padding:18px 0 8px}
section[hidden]{display:none}

/* fixtures */
.mrow{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;
  background:var(--panel);border:1px solid var(--line);margin-bottom:7px;box-shadow:var(--shadow)}
.mrow.is-next{border-color:var(--red);background:var(--nextbg)}
.mdate{width:52px;flex:0 0 52px;font-size:11px;color:var(--mut);line-height:1.3;font-variant-numeric:tabular-nums}
.mdate b{display:block;font-size:15px;color:var(--tx);font-weight:700}
.mopp{flex:1;min-width:0;font-size:15px;font-weight:600;display:flex;align-items:baseline;gap:5px}
.mopp .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mopp i,.mopp .cbadge{flex:0 0 auto}
.mopp i{font-style:normal;color:var(--mut);font-weight:600;font-size:12px}
.mres{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.mtag{font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--red);text-transform:uppercase}
.mnth{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--mut);margin:16px 0 8px}
.mnth:first-child{margin-top:0}

/* table */
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);
  text-align:right;padding:0 0 8px}
th:first-child{padding-right:10px}
th:nth-child(2){text-align:left}
td{padding:9px 0;border-top:1px solid var(--line);text-align:right}
td:nth-child(2){text-align:left;font-weight:600}
td:first-child{width:24px;color:var(--mut);font-size:12px;padding-right:10px}
tr.wxm td{background:rgba(224,36,47,.11);font-weight:700}
tr.wxm td:nth-child(2){box-shadow:inset 3px 0 0 var(--red)}
tr.line td{border-top:2px solid var(--red-dim)}
.tkey{font-size:12px;color:var(--mut);margin-top:12px;line-height:1.7}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.links a{font-size:12px;font-weight:600;color:var(--red);border:1px solid var(--red-dim);
  border-radius:999px;padding:7px 12px;min-height:34px;display:inline-flex;align-items:center}
.links a:hover{background:var(--red);color:#fff;border-color:var(--red)}
.tkey b{color:var(--tx)}
.hide-sm{}
.nshort{display:none}
.nabbr{display:none}
@media(max-width:520px){.hide-sm{display:none}}
@media(max-width:430px){.nfull{display:none}.nshort{display:inline}.mdate{width:44px;flex:0 0 44px}}
/* below 360px even the short name collides (West Ham / West Bromwich) — use the abbreviation */
@media(max-width:360px){.nshort{display:none}.nabbr{display:inline}.mopp i{display:none}}

/* promotion */
.big{font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1.1}
.bar{height:9px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:13px 0 7px;position:relative}
.bar i{display:block;height:100%;background:var(--red);border-radius:6px}
.bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);opacity:.65}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--panel2);border-radius:10px;padding:11px}
.stat b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.note{font-size:13px;color:var(--mut);line-height:1.6;margin-top:13px}

/* news + podcasts */
.item{display:block;background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:13px;margin-bottom:8px;box-shadow:var(--shadow)}
.item:active{background:var(--panel2)}
.meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--mut);margin-bottom:5px;flex-wrap:wrap}
.src{color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.item h3{font-size:15px;font-weight:600;line-height:1.4}
.item p{font-size:13px;color:var(--mut);margin-top:5px;line-height:1.5}
audio{width:100%;margin-top:10px;height:34px}

footer{border-top:1px solid var(--line);margin-top:26px;padding:18px 0 30px;
  font-size:12px;color:var(--mut);text-align:center;line-height:2}
footer img{vertical-align:middle;margin-top:5px;min-height:20px}
/* many club crests are dark; a light chip keeps them visible on a dark ground */
.crest{width:22px;height:22px;object-fit:contain;flex:0 0 22px;
  background:var(--chip);border-radius:5px;padding:2px}
.crest.lg{border-radius:9px;padding:4px}
.crest.lg{width:34px;height:34px;flex:0 0 34px}
.cbadge{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:var(--cup-tx);border:1px solid var(--cup-line);background:var(--cup-bg);border-radius:4px;padding:2px 5px}
.cal{display:inline-flex;align-items:center;justify-content:center;gap:4px;
  min-height:40px;font-size:11px;font-weight:700;
  color:var(--red);border:1px solid var(--red-dim);background:var(--panel);
  border-radius:999px;padding:4px 9px;text-decoration:none;white-space:nowrap}
.cal:hover{background:var(--red);color:#fff;border-color:var(--red)}
.cal.hl{font-size:13px;padding:6px 10px;min-height:34px}
.mlocal{font-size:10px;color:var(--mut);display:block}
.mtime{flex:0 0 auto;text-align:right;font-size:11px;color:var(--mut);line-height:1.3;
  font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:360px){.mlocal{display:none}.mrow{gap:8px}}
/* match centre */
.mc-head{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 0 14px}
.mc-side{display:flex;flex-direction:column;align-items:center;gap:6px;width:88px;text-align:center}
.mc-side span{font-size:11px;color:var(--mut);line-height:1.3}
.mc-score{font-size:36px;font-weight:800;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.tl{border-left:2px solid var(--line);margin:4px 0 4px 7px;padding-left:14px}
.tl div{position:relative;font-size:13px;padding:5px 0;color:var(--tx)}
.tl div::before{content:"";position:absolute;left:-19px;top:11px;width:8px;height:8px;
  border-radius:50%;background:var(--line)}
.tl div.g::before{background:var(--red)}
.tl b{font-variant-numeric:tabular-nums;color:var(--mut);font-weight:600;margin-right:7px}
.tl em{font-style:normal;color:var(--mut);font-size:11px}
.sb{margin:9px 0}
.sb .lab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;
  font-variant-numeric:tabular-nums}
.sb .lab i{font-style:normal;color:var(--mut)}
.sb .tr{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--panel2)}
.sb .tr u{display:block;background:var(--red)}
.sb .tr s{display:block;background:var(--neutral)}
.xi{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:12px;margin-top:6px}
.xi ol{list-style:none;line-height:1.85}
.xi h4{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:5px}
.xi i{font-style:normal;color:var(--mut);font-size:10px;margin-right:5px}
.yt{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:10px}
.ytph{background:var(--panel2);display:grid;place-items:center}
.ytph::after{content:"\25b6 Highlights";color:var(--mut);font-size:13px;font-weight:600}
.obar{display:flex;height:11px;border-radius:6px;overflow:hidden;margin:10px 0 9px;gap:2px}
.obar i{display:block}
.okey{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);gap:8px}
.okey b{display:block;font-size:16px;color:var(--tx);font-variant-numeric:tabular-nums}
.olink{display:inline-block;margin-top:11px;font-size:12px;color:var(--red);font-weight:600;
  padding:6px 0;min-height:24px}
.skel{color:var(--mut);padding:26px 0;text-align:center;font-size:14px}

/* Desktop was a phone layout stretched across the screen: a 720px column in a
   1680px window wasted 57% of the width and made the page 4000px tall. */
@media(min-width:1000px){
  .wrap{max-width:1120px}
  .tabs{max-width:1120px}
  /* band: identity left, season state right, instead of 1000px of empty red */
  .bandgrid{display:flex;align-items:flex-end;gap:36px}
  .bandgrid .left{flex:0 1 auto;min-width:0}
  .bandgrid .right{flex:0 0 360px}
  .story{margin-top:10px}
  .progline{margin-top:9px}
  /* the long lists go two-up, which halves the scroll */
  #fixtures:not([hidden]),#news:not([hidden]),#pods:not([hidden]),#squad:not([hidden]){
    display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-content:start}
  #fixtures .mnth,#squad .mnth{grid-column:1 / -1}
  #news .item,#pods .item,#fixtures .mrow,#squad .mrow{margin-bottom:9px}
  .hero{grid-template-columns:1fr 1fr 1fr;gap:14px}
  /* a league table is a reading unit, not a full-bleed one */
  #table table{max-width:660px}
  .tkey{max-width:660px}
  .story{max-width:none;white-space:nowrap}
}
@media(min-width:1400px){ .wrap,.tabs{max-width:1240px} }
</style>
</head>
<body>

<header><div class="band"><div class="wrap bandgrid">
  <div class="left">
    <div class="mark">
      <h1>WREXHAM<span>.</span></h1>
      <span class="badge" id="comp">Championship 2026/27</span>
    </div>
    <p class="story">Second season in the Championship &middot; chasing a fourth promotion in five years</p>
  </div>
  <div class="right">
    <div class="tzwrap">
      <label for="tz">Show times in</label>
      <select id="tz" aria-label="Show kickoff times in this timezone"></select>
    </div>
    <div class="sbar" aria-hidden="true"><i id="sbarfill"></i></div>
    <div class="progline"><span id="prog"></span><span id="streak"></span></div>
  </div>
</div></div><div class="wrap">
  <div class="hero">
    <div class="card" id="last"><h2>Last result</h2><div class="skel" style="padding:8px 0">—</div></div>
    <div class="card" id="next"><h2>Next match</h2><div class="skel" style="padding:8px 0">—</div></div>
  <div class="card hero3" id="stand"></div>
  </div>
</div></header>

<nav><div class="tabs" role="tablist">
  <button class="tab" role="tab" aria-selected="true"  data-p="table">Table</button>
  <button class="tab" role="tab" aria-selected="false" data-p="fixtures">Fixtures</button>
  <button class="tab" role="tab" aria-selected="false" data-p="centre">Match</button>
  <button class="tab" role="tab" aria-selected="false" data-p="promo">Chances</button>
  <button class="tab" role="tab" aria-selected="false" data-p="squad">Squad</button>
  <button class="tab" role="tab" aria-selected="false" data-p="news">News</button>
  <button class="tab" role="tab" aria-selected="false" data-p="pods">Podcasts</button>
  <button class="tab" role="tab" aria-selected="false" data-p="info">About</button>
</div></nav>

<div id="tip" role="status" aria-live="polite"></div>
<main class="wrap">
  <section id="table"></section>
  <section id="fixtures" hidden><div class="skel">Loading…</div></section>
  <section id="promo" hidden></section>
  <section id="centre" hidden></section>
  <section id="squad" hidden></section>
  <section id="news" hidden></section>
  <section id="pods" hidden></section>
  <section id="info" hidden></section>
</main>

<footer><div class="wrap">
  <div id="stamp">—</div>
  <div>Data: ESPN · Google News · Polymarket · public podcast feeds</div>
  <a href="https://hits.sh/danpune.github.io/wrexham-tracker/"><img
     src="https://hits.sh/danpune.github.io/wrexham-tracker.svg?style=flat-square&label=visitors&color=e0242f&labelColor=15181d"
     alt="visitor count" height="20" loading="lazy"></a>
</div></footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Kick-offs are UK events: always render them in UK time, never the viewer's
// local clock, or a fan abroad sees the wrong day for an evening fixture.
const UK = {timeZone: "Europe/London"};
const ukTime  = d => d.toLocaleTimeString("en-GB", {...UK, hour:"2-digit", minute:"2-digit"});
const ukDay   = d => d.toLocaleDateString("en-GB", {...UK, weekday:"short"});
const ukDayNo = d => d.toLocaleDateString("en-GB", {...UK, day:"numeric"});
const ukMonth = d => d.toLocaleDateString("en-GB", {...UK, month:"short", year:"numeric"});
const ukFull  = d => d.toLocaleDateString("en-GB", {...UK, day:"numeric", month:"short"});
const DEVICE_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
// Curated rather than all ~400 IANA zones: a 400-row select is unusable on a
// phone, and this covers where Wrexham's audience actually watches from.
const TZ_OPTS = [
  ["__device__", `Your time (${DEVICE_TZ.split("/").pop().replace(/_/g, " ")})`],
  ["Europe/London", "UK"],
  ["Europe/Dublin", "Ireland"],
  ["America/New_York", "US Eastern"],
  ["America/Chicago", "US Central"],
  ["America/Denver", "US Mountain"],
  ["America/Los_Angeles", "US Pacific"],
  ["America/Toronto", "Canada Eastern"],
  ["Asia/Kolkata", "India"],
  ["Asia/Dubai", "UAE"],
  ["Asia/Singapore", "Singapore"],
  ["Australia/Sydney", "Sydney"],
];
let TZ = DEVICE_TZ;
try {                                  // remembered across visits
  const saved = localStorage.getItem("wxm-tz");
  if (saved && (saved === "__device__" || TZ_OPTS.some(o => o[0] === saved)))
    TZ = saved === "__device__" ? DEVICE_TZ : saved;
} catch (e) {}
const localTime = d => d.toLocaleTimeString("en-GB", {timeZone: TZ, hour:"2-digit", minute:"2-digit"});
const localDay  = d => d.toLocaleDateString("en-GB", {timeZone: TZ, weekday:"short", day:"numeric", month:"short"});
const fmtShort  = iso => new Date(iso + "T12:00:00Z")
  .toLocaleDateString("en-GB", {day:"numeric", month:"short"});
const dayKey    = (d, tz) => d.toLocaleDateString("en-CA", {timeZone: tz});
// true when the chosen zone is on a different calendar day to the UK kickoff
const spansDay  = d => dayKey(d, TZ) !== dayKey(d, "Europe/London");
// short tag for the picked zone, so a row never shows two unlabelled clocks
const tzShort = () => {
  const city = TZ.split("/").pop().replace(/_/g, " ");
  try {
    const n = new Intl.DateTimeFormat("en-US", {timeZone: TZ, timeZoneName: "short"})
      .formatToParts(new Date()).find(p => p.type === "timeZoneName").value;
    // en-US gives "CDT" for Chicago but "GMT+5:30" for Kolkata — prefer the city
    // name over a raw offset, which tells a reader nothing.
    return /^GMT/.test(n) ? city : n;
  } catch (e) { return city; }
};

function ago(iso){
  const m = (Date.now() - new Date(iso)) / 6e4;
  if (m < 1)    return "just now";        // clock skew in feeds gives negatives
  if (m < 60)   return Math.round(m) + "m ago";
  if (m < 1440) return Math.round(m / 60) + "h ago";
  return Math.round(m / 1440) + "d ago";
}

function tabs(){
  document.querySelectorAll(".tab").forEach((t, i) => {
    t.id = "tab-" + t.dataset.p;
    t.setAttribute("aria-controls", t.dataset.p);
    const sec = document.getElementById(t.dataset.p);
    sec.setAttribute("role", "tabpanel");
    sec.setAttribute("aria-labelledby", t.id);
    t.onclick = () => {
      if (t.dataset.p === "centre"){                 // load the embed only on view
        const ph = document.querySelector("#centre .ytph[data-yt]");
        if (ph) ph.outerHTML = `<iframe class="yt" src="https://www.youtube-nocookie.com/embed/`
          + ph.dataset.yt + `" title="Match highlights" allowfullscreen></iframe>`;
      }
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
    document.querySelectorAll("main section").forEach(s => s.hidden = s.id !== t.dataset.p);
    scrollTo({top: 0, behavior: "smooth"});
    };
  });
}

// One definition of "next", shared by the hero and the fixtures list, so they
// cannot disagree when ESPN is late marking a match complete.
const nextMatch = d => d.matches.find(m => !m.completed && !m.awaitingResult)
                    || d.matches.find(m => !m.completed);

function hero(d){  // d used for nextInfo below
  const played = d.matches.filter(m => m.completed);
  const last = played[played.length - 1];
  if (last){
    const cls = last.result === "W" ? "--w" : last.result === "L" ? "--l" : "--d";
    const wxLogo = (d.table.find(r => r.isWrexham) || {}).logo || "";
    $("#last").innerHTML = `<h2>Last result</h2>
      <div class="sline">
        <img class="crest" src="${esc(wxLogo)}" alt="" loading="lazy">
        <div class="score" style="color:var(${cls})">${last.us}&ndash;${last.them}</div>
        <img class="crest" src="${esc(last.logo)}" alt="" loading="lazy">
      </div>
      <div class="opp"><span class="vs">${last.home ? "vs" : "away at"}</span> ${esc(last.opponent)}
        ${last.home ? " &middot; Y Cae Ras" : ""}
        ${last.comp !== "League" ? `<span class="cbadge">${esc(last.comp)}</span>` : ""}</div>
      <div class="form">${(d.projection?.form || []).map(f => `<span class="pill ${f}">${f}</span>`).join("")}</div>
      ${d.lastMatch?.stats?.us?.possessionPct != null ? `<div class="opp" style="margin-top:10px">
        ${esc(String(d.lastMatch.stats.us.possessionPct))}% possession &middot; ${esc(String(d.lastMatch.stats.us.totalShots))} shots</div>` : ""}
      <div><a class="olink" href="#" id="tocentre">Match centre &rarr;</a></div>`;
    const tc = $("#tocentre");                       // rebound: hero() re-renders this node
    if (tc) tc.onclick = e => { e.preventDefault(); $('.tab[data-p="centre"]').click(); };
  }
  const next = nextMatch(d);
  if (!next){ $("#next").innerHTML = "<h2>Next match</h2><div class='opp'>Season complete</div>"; return; }
  const dt = new Date(next.date);
  const when = dt.toLocaleString("en-GB", {...UK, weekday:"short", day:"numeric", month:"short",
                                           hour:"2-digit", minute:"2-digit"}) + " UK";
  const mine = localTime(dt), differs = TZ !== "Europe/London";
  const tzName = (TZ_OPTS.find(o => o[0] === TZ) || [])[1] || TZ.split("/").pop().replace(/_/g, " ");
  $("#next").innerHTML = `<h2>Next match</h2>
    <div class="count" id="cd">&nbsp;</div>
    <div class="opp"><img class="crest" src="${esc(next.logo)}" alt="" loading="lazy"> ${next.home ? "vs" : "at"} <b>${esc(next.opponent)}</b>
      ${next.comp !== "League" ? `<span class="cbadge">${esc(next.comp)}</span>` : ""}</div>
    <div class="next-when">${when}${differs ? ` &middot; ${mine}${spansDay(dt) ? " " + esc(localDay(dt).split(" ")[0]) : ""} ${esc(tzName)}` : ""}
      ${(() => { const k = x => x.toLocaleDateString("en-CA", {timeZone: TZ}), now = new Date(),
                 tmr = new Date(now.getTime() + 864e5);
                 return k(dt) === k(now) ? `<span class="cdtag">Today</span>`
                      : k(dt) === k(tmr) ? `<span class="cdtag tmr">Tomorrow</span>` : ""; })()}</div>
    ${d.nextInfo && d.nextInfo.weather ? `<div class="opp" style="margin-top:6px">${d.nextInfo.weather.icon} ${d.nextInfo.weather.temp}&deg;C ${esc(d.nextInfo.weather.label)}${d.nextInfo.venue ? " &middot; " + esc(d.nextInfo.venue) : ""}</div>` : ""}
    ${d.nextInfo && d.nextInfo.tv.length ? `<div class="opp">&#128250; ${d.nextInfo.tv.map(esc).join(", ")}</div>` : ""}
    ${d.nextInfo && d.nextInfo.h2h ? `<div class="opp" style="font-size:12px">${esc(d.nextInfo.h2h)}</div>` : ""}
    <div>${next.awaitingResult ? "" : `<a class="olink" href="ics/${esc(next.id)}.ics">&#128197; Add to calendar</a>`}
      <a class="olink" style="margin-left:22px" href="ics/wrexham.ics">Subscribe to all fixtures</a></div>`;
  clearTimeout(window.__cdiv); window.__cdiv = null;   // hero() can run again (tz change)
  let settled = false;
  // Precision follows how close it is: minutes are noise two days out, and the
  // card should feel different on match day than it does midweek.
  const seg = (n, unit) => `<span><b>${n}</b><i>${unit}</i></span>`;
  const ukDayKey = x => x.toLocaleDateString("en-CA", UK);
  const tick = () => {
    const el = $("#cd");
    if (next.awaitingResult){ el.className = "count"; el.innerHTML = seg("FT", "full time"); settled = true; return; }
    const s = (dt - Date.now()) / 1000;
    if (s <= 0){
      el.className = "count live";
      el.innerHTML = `<span><b>LIVE</b><i>kicked off</i></span>`;
      settled = true; return;
    }
    const dd = Math.floor(s/86400), hh = Math.floor(s%86400/3600),
          mm = Math.floor(s%3600/60), ss = Math.floor(s%60);
    el.className = "count" + (s < 3600 ? " soon" : "");
    const u = (n, one, many) => n === 1 ? one : many;
    el.innerHTML = dd >= 1 ? seg(dd, u(dd, "day", "days")) + seg(hh, u(hh, "hr", "hrs"))
                 : s >= 3600 ? seg(hh, u(hh, "hr", "hrs")) + seg(mm, u(mm, "min", "mins"))
                 : seg(mm, u(mm, "min", "mins")) + seg(ss, u(ss, "sec", "secs"));
  };
  tick();
  // Only tick per-second once the seconds are actually on screen.
  // Self-rescheduling: a fixed interval picked its period once, so a page left
  // open crossed into the mins+secs display still ticking every 30 or 60s.
  const schedule = () => {
    const away = dt - Date.now();
    window.__cdiv = setTimeout(() => { tick(); if (!settled) schedule(); },
                               away > 864e5 ? 60000 : away > 36e5 ? 30000 : 1000);
  };
  if (!settled) schedule();
}

function fixtures(d){
  let html = "", month = "";
  for (const m of d.matches){
    const dt = new Date(m.date), mn = ukMonth(dt);
    if (mn !== month){ html += `<div class="mnth">${mn}</div>`; month = mn; }
    const isNext = m === nextMatch(d);
    const right = m.completed
      ? `<div class="mres" style="color:var(--${m.result === "W" ? "w" : m.result === "L" ? "l" : "d"})">${m.us}&ndash;${m.them}</div>`
      : m.awaitingResult ? `<div class="mtag" style="color:var(--mut)">Full time</div>`
      : isNext ? `<div class="mtag">Next</div>`
      : `<div class="mtime">${ukTime(dt)}
           ${TZ !== "Europe/London" ? `<span class="mlocal">${localTime(dt)}${spansDay(dt) ? " " + esc(localDay(dt).split(" ")[0]) : ""} ${esc(tzShort())}</span>` : ""}</div>`;
    html += `<div class="mrow${isNext ? " is-next" : ""}">
      <div class="mdate"><b>${ukDayNo(dt)}</b>${ukDay(dt)}</div>
      <img class="crest" src="${esc(m.logo)}" alt="" loading="lazy">
      <div class="mopp"><span class="nm"><span class="nfull">${esc(m.opponent)}</span><span class="nshort">${esc(m.opponentShort || m.opponent)}</span><span class="nabbr">${esc(m.opponentAbbr || m.opponentShort || m.opponent)}</span></span><i>${m.home ? "(H)" : "(A)"}</i>
        ${m.comp !== "League" ? `<span class="cbadge">${esc(m.comp)}</span>` : ""}</div>
      ${right}
      ${m.completed
          ? (m.yt ? `<a class="cal hl" href="https://www.youtube.com/watch?v=${esc(m.yt)}" target="_blank" rel="noopener noreferrer" aria-label="Watch ${esc(m.opponent)} highlights">&#127916;</a>` : "")
          : m.awaitingResult ? ""
          : `<a class="cal" href="ics/${esc(m.id)}.ics" aria-label="Add ${esc(m.opponent)} match to your calendar">+ Cal</a>`}</div>`;
  }
  $("#fixtures").innerHTML = html;
}

// Club ownership, from each club's Wikipedia infobox, checked 4 Sep 2026. No
// feed carries this, so it is hand-kept -- a takeover goes stale here silently,
// which is why the table says when it was last checked.
const OWNERS = {
  "Wrexham":                 ["Rob McElhenney & Ryan Reynolds", "Owners"],
  "Swansea City":            ["Swansea Football LLC (71%)", "Owner"],
  "Queens Park Rangers":     ["Ruben Gnanalingam & Lakshmi Mittal", "Owners"],
  "Charlton Athletic":       ["Global Football Partners", "Owner"],
  "Wolverhampton Wanderers": ["Fosun International", "Owner"],
  "Middlesbrough":           ["Steve Gibson", "Owner"],
  "Bristol City":            ["Steve Lansdown", "Owner"],
  "West Bromwich Albion":    ["Bilkul Football WBA (Shilen Patel)", "Owner"],
  "Birmingham City":         ["Tom Wagner", "Chairman"],
  "Sheffield United":        ["COH Sports", "Owner"],
  "Millwall":                ["James Berylson", "Chairman"],
  "West Ham United":         ["Daniel Kretinsky & David Sullivan", "Owners"],
  "Blackburn Rovers":        ["Venky's London Ltd (99.9%)", "Owner"],
  "Watford":                 ["Gino Pozzo", "Owner"],
  "Bolton Wanderers":        ["Sharon Brittan", "Chair"],
  "Derby County":            ["David Clowes", "Owner"],
  "Lincoln City":            ["Ron Fowler", "Chairman"],
  "Southampton":             ["Sport Republic (Dragan Solak)", "Owner"],
  "Cardiff City":            ["Vincent Tan", "Owner"],
  "Norwich City":            ["Norfolk FB Holdings (Mark Attanasio)", "Owner"],
  "Portsmouth":              ["Michael Eisner", "Owner"],
  "Stoke City":              ["Stoke City Holdings (John Coates)", "Owner"],
  "Burnley":                 ["ALK Capital (Alan Pace)", "Owner"],
  "Preston North End":       ["Wordon Limited", "Owner"],
};

function table(d){
  const rows = d.table.map(r => {
    const cls = [r.isWrexham ? "wxm" : "", (r.rank === 7 || r.rank === 22) ? "line" : ""].join(" ").trim();
    return `<tr class="${cls}"><td>${r.rank}</td><td data-ded="${r.deducted > 0 ? r.deducted : ""}" ${OWNERS[r.team]
        ? `tabindex="0" class="own" data-t="${esc(OWNERS[r.team][1])}: ${esc(OWNERS[r.team][0])}"` : ""}><img class="crest" style="width:17px;height:17px;flex:none;vertical-align:-4px;margin-right:7px" src="${esc(r.logo)}" alt="" loading="lazy">${esc(r.team)}${r.deducted > 0 ? `<sup aria-label="minus ${r.deducted} points" title="${r.deducted} point deduction" style="color:var(--red);font-weight:700"> -${r.deducted}</sup>` : ""}</td>
      <td>${r.played}</td><td class="hide-sm">${r.won}</td><td class="hide-sm">${r.drawn}</td>
      <td class="hide-sm">${r.lost}</td><td>${r.gd > 0 ? "+" : ""}${r.gd}</td>
      <td class="hide-sm formcell">${(r.form || []).map(f => `<span class="fp ${f.r}" tabindex="0"
        data-t="${esc(f.r === "W" ? "Won" : f.r === "L" ? "Lost" : "Drew")} ${esc(f.s)} ${f.h ? "v" : "at"} ${esc(f.o)} · ${esc(fmtShort(f.d))}"
        title="${esc(f.r === "W" ? "Won" : f.r === "L" ? "Lost" : "Drew")} ${esc(f.s)} ${f.h ? "v" : "at"} ${esc(f.o)} · ${esc(fmtShort(f.d))}">${f.r}</span>`).join("")}</td>
      <td>${r.points}</td></tr>`;
  }).join("");
  $("#table").innerHTML = `<table><thead><tr><th scope="col"></th><th scope="col">Team</th><th scope="col">P</th>
    <th scope="col" class="hide-sm">W</th><th scope="col" class="hide-sm">D</th><th scope="col" class="hide-sm">L</th><th scope="col">GD</th><th scope="col" class="hide-sm">Form</th><th scope="col">Pts</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="tkey"><b>Form</b> reads oldest to newest &mdash; tap or hover a result for the score.<br>
    Tap a <b>club name</b> for who owns it (Wikipedia, checked 4 Sep 2026).<br>
    Line after 6th &mdash; <b>playoff cut</b>. Line after 21st &mdash; relegation.<br>
    Top 2 promoted automatically; 3rd&ndash;6th enter the playoffs.</div>`;
}

function promo(d){
  const p = d.projection;
  const pct = Math.min(100, p.points / p.cutoff * 100);
  const headline = p.tooEarly
    ? `<div class="big">Too early</div>
       <div class="note" style="margin-top:8px">Only ${p.played} games played. A points-per-game projection
       this early is noise, so the forecast unlocks after 8 games.</div>`
    : `<div class="big">${p.projected} pts</div>
       <div class="note" style="margin-top:6px">projected final total &middot; playoff cut is around ${p.cutoff}</div>`;
  $("#promo").innerHTML = `<div class="card">${headline}
    <div class="bar"><i style="width:${pct}%"></i><u style="left:calc(100% - 2px)"></u></div>
    <div class="note" style="margin-top:0">${p.points} pts banked of the ~${p.cutoff} that usually reaches the playoffs.</div>
    <div class="stats">
      <div class="stat"><b>${p.rank}${["th","st","nd","rd"][p.rank % 10 < 4 && Math.floor(p.rank/10) !== 1 ? p.rank % 10 : 0]}</b><span>Position</span></div>
      <div class="stat"><b>${p.ppg}</b><span>Pts / game</span></div>
      <div class="stat"><b>${p.neededPpg}</b><span>Needed / game</span></div>
    </div>
    <div class="note">
      ${p.rank > 6 ? `<b style="color:var(--tx)">${p.gapToSixth > 0 ? p.gapToSixth + " pts" : "Level on points"}</b> ${p.gapToSixth > 0 ? "behind 6th" : "with 6th, behind on goal difference"} with ${p.remaining} to play.`
                         : `<b style="color:var(--tx)">Inside the playoff places</b> with ${p.remaining} to play.`}<br>
      Last season Wrexham finished 7th &mdash; two points short of the playoffs.<br>
      This is a straight-line projection from current form, not a simulation. Treat it as a pulse, not a prediction.
    </div></div>
    <h2 style="font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin:22px 0 10px">
      What the market thinks</h2>` + odds(d);
}

// The third hero slot: where Wrexham actually sit, without changing tab.
function standing(d){
  const el = $("#stand"); if (!el) return;
  const i = d.table.findIndex(r => r.isWrexham);
  if (i < 0){ el.innerHTML = ""; return; }
  // Keep the playoff cut in view when they are near it, so the caption below
  // always refers to a line that is actually drawn.
  let from = Math.max(0, Math.min(i - 2, d.table.length - 5));
  if (i >= 4 && i <= 9) from = Math.max(0, Math.min(4, d.table.length - 5));
  const rows = d.table.slice(from, from + 5).map(r => `
    <tr class="${r.isWrexham ? "me" : ""}${r.rank === 7 ? " cut" : ""}">
      <td>${r.rank}</td>
      <td><img class="crest" style="width:16px;height:16px;flex:none;vertical-align:-3px;margin-right:6px" src="${esc(r.logo)}" alt="" loading="lazy">${esc(r.abbr || r.team)}</td>
      <td>${r.points}</td></tr>`).join("");
  el.innerHTML = `<h2>Where they stand</h2><table class="mini"><tbody>${rows}</tbody></table>
    ${rows.includes("cut") ? `<div class="note" style="margin-top:9px;font-size:11px">Red line is the playoff cut &mdash; top 6 go up or into the playoffs.</div>` : `<div class="note" style="margin-top:9px;font-size:11px">Top 6 go up or into the playoffs.</div>`}`;
}

// archive.json holds stats/events/XIs for every finished game. Fetched once,
// and only when someone actually picks a match other than the latest -- the
// default view is served entirely from data.json, so first paint costs nothing.
let ARCHIVE = null;
let CURRENT = null;      // the match on screen, so Share exports what you're looking at
const archive = () => (ARCHIVE ||= fetch("archive.json")
  .then(r => r.ok ? r.json() : {}).catch(() => ({})));

// Same shape fetch_summary() builds for lastMatch, assembled client-side from a
// match record plus its cached detail, so one renderer serves both.
const payloadFor = (m, det) => ({
  yt: m.yt || null,
  search: "https://www.youtube.com/results?search_query="
          + encodeURIComponent(`Wrexham ${m.opponent} highlights`),
  match: {opponent: m.opponent, logo: m.logo, home: m.home, us: m.us,
          them: m.them, date: m.date, comp: m.comp, result: m.result},
  ...det,
});

function centre(d){
  const done = d.matches.filter(m => m.completed)
                        .sort((a, b) => b.date.localeCompare(a.date));
  if (!done.length){ $("#centre").innerHTML = "<div class='skel'>No completed match yet.</div>"; return; }

  const opt = m => `<option value="${esc(m.id)}">${esc(m.opponent)} `
    + `(${m.home ? "H" : "A"}) &middot; ${esc(m.result)} ${m.us}&ndash;${m.them} `
    + `&middot; ${esc(fmtShort(m.date.slice(0, 10)))}${m.yt ? " \u25b6" : ""}</option>`;

  const withVid = done.filter(m => m.yt).length;
  $("#centre").innerHTML = `<div class="card mpick">
      <label for="mpick">Match</label>
      <select id="mpick">${done.map(opt).join("")}</select>
      <p class="note" style="margin:8px 0 0">${done.length} played this season,
        ${withVid} with highlights (&#9654;). Picking a game loads its stats, timeline and XIs.</p>
    </div>
    <div id="mcbody"></div>`;

  // The newest game's detail is already in data.json -- no request for the default view.
  renderMatch(d, d.lastMatch || payloadFor(done[0], {stats:{}, events:[], lineups:{}}));

  $("#mpick").onchange = async e => {
    const m = done.find(x => x.id === e.target.value);
    if (!m) return;
    $("#mcbody").innerHTML = "<div class='skel'>Loading match&hellip;</div>";
    const det = (await archive())[m.id];
    if ($("#mpick").value !== m.id) return;          // a newer pick won the race
    renderMatch(d, payloadFor(m, det || {stats:{}, events:[], lineups:{}}));
  };
}

function renderMatch(d, L){
  const m = L.match, us = (L.stats || {}).us || {}, them = (L.stats || {}).them || {};
  const n = v => parseFloat(v) || 0;

  const bar = (label, a, b) => {
    const t = n(a) + n(b) || 1;
    return `<div class="sb"><div class="lab"><b>${esc(String(a ?? 0))}</b><i>${label}</i><b>${esc(String(b ?? 0))}</b></div>
      <div class="tr"><u style="width:${n(a)/t*100}%"></u><s style="width:${n(b)/t*100}%"></s></div></div>`;
  };

  const evs = L.events || [];
  const timeline = evs.length ? `<div class="tl">${evs.map(e => `
    <div class="${["goal","own","pen"].includes(e.kind) ? "g" : ""}"><b>${esc(e.clock)}</b>
      ${e.kind === "goal" || e.kind === "own" || e.kind === "pen" ? "&#9917;"
        : e.kind === "red" ? "&#128308;" : "&#129000;"}
      ${esc(e.who || "")}${e.kind === "own" ? " <em>(OG)</em>" : e.kind === "pen" ? " <em>(pen)</em>" : ""}
      <em>${e.us ? "Wrexham" : esc(m.opponent)}</em></div>`).join("")}</div>` : "";

  const xis = (L.lineups || {});
  const xi = side => `<div><h4>${side === "us" ? "Wrexham" : esc(m.opponent)}</h4><ol>${
    (xis[side] || []).map(p => `<li><i>${esc(p.pos)}</i>${esc(p.name)}</li>`).join("")}</ol></div>`;

  const video = L.yt
    ? `<div class="yt ytph" data-yt="${esc(L.yt)}"></div>`
    : `<a class="olink" href="${esc(L.search)}" target="_blank" rel="noopener noreferrer">&#127916; Find highlights on YouTube &rarr;</a>`;

  const noStats = !Object.keys(us).length && !Object.keys(them).length;

  $("#mcbody").innerHTML = `<div class="card">
    <div class="meta"><span class="src">${esc(m.comp)}</span><span>${ukFull(new Date(m.date))}</span></div>
    <div class="mc-head">
      <div class="mc-side"><img class="crest lg" src="${esc((d.table.find(r => r.isWrexham) || {}).logo || "")}" alt="" loading="lazy"><span>Wrexham</span></div>
      <div class="mc-score" style="color:var(--${m.result === "W" ? "w" : m.result === "L" ? "l" : "d"})">
        ${m.us}&ndash;${m.them}</div>
      <div class="mc-side"><img class="crest lg" src="${esc(m.logo)}" alt="" loading="lazy"><span>${esc(m.opponent)}</span></div>
    </div>
    ${timeline}
    ${noStats ? `<div class="note">ESPN published no stats for this game.</div>` : `<div style="margin-top:14px">
      ${bar("Possession %", us.possessionPct, them.possessionPct)}
      ${bar("Shots", us.totalShots, them.totalShots)}
      ${bar("On target", us.shotsOnTarget, them.shotsOnTarget)}
      ${bar("Corners", us.wonCorners, them.wonCorners)}
      ${bar("Fouls", us.foulsCommitted, them.foulsCommitted)}
    </div>`}
    ${video}
    <div><button class="olink" id="sharebtn" style="background:none;border:0;cursor:pointer;font-family:inherit;padding:0">
      &#8599; Share this result</button></div>
  </div>
  ${(xis.us || xis.them) ? `<div class="card"><h2>Starting XI</h2><div class="xi">${xi("us")}${xi("them")}</div></div>` : ""}`;
  CURRENT = L;
}

function odds(d){
  const rows = d.matches.filter(m => !m.completed && !m.awaitingResult && d.odds[m.date.slice(0,10)]).slice(0, 5).map(m => {
    const o = d.odds[m.date.slice(0,10)], b = o.book;
    const sum = b.wrexham + b.draw + b.opponent;   // 3 binaries: prices carry spread, so > 1
    const seg = (v, c) => `<i style="width:${(v/sum*100).toFixed(1)}%;background:${c}"></i>`;
    const pc = v => (v*100).toFixed(0) + "%";
    return `<div class="card" style="margin-bottom:10px">
      <div class="meta"><span class="src">${ukFull(new Date(m.date))}</span><span>${m.home ? "vs" : "at"} ${esc(m.opponent)}</span></div>
      <div class="obar">${seg(b.wrexham,"var(--red)")}${seg(b.draw,"var(--neutral)")}${seg(b.opponent,"var(--mut)")}</div>
      <div class="okey">
        <span><b style="color:var(--red)">${pc(b.wrexham)}</b> Wrexham</span>
        <span><b>${pc(b.draw)}</b> Draw</span>
        <span><b>${pc(b.opponent)}</b> ${esc(m.opponentAbbr || "Opp")}</span>
      </div>
      <a class="olink" href="${esc(o.url)}" target="_blank" rel="noopener noreferrer">View market on Polymarket &rarr;</a>
    </div>`;
  }).join("");
  return (rows || `<div class="card"><div class="note" style="margin:0">No live markets for the
    next fixtures yet. Polymarket usually lists a Championship match a few days out.</div></div>`) +
    `<div class="note">Prices are live Polymarket markets &mdash; what people are actually betting, not a model.
     Each of the three outcomes is its own contract, so the percentages may not sum to exactly 100%.<br>
     Kalshi lists these same fixtures but every contract is currently quoteless &mdash; no bid, ask or open
     interest &mdash; so there is nothing to show from it.<br>
     Display only. This site has no trading integration and nothing here is betting or financial advice.</div>`;
}

function shareResult(d){
  const L = CURRENT || d.lastMatch; if (!L) return;
  const m = L.match, W = 1200, H = 630;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = "#0d0f12"; x.fillRect(0, 0, W, H);
  x.fillStyle = "#e0242f"; x.fillRect(0, 0, W, 9);
  const F = (s, w) => `${w} ${s}px -apple-system, Helvetica, Arial, sans-serif`;

  x.fillStyle = "#8b929e"; x.font = F(28, 700);
  x.fillText(`${m.comp.toUpperCase()}  ·  ${new Date(m.date).toLocaleDateString("en-GB",
    {timeZone:"Europe/London", day:"numeric", month:"long"}).toUpperCase()}`, 80, 120);

  x.fillStyle = "#e9ecf1"; x.font = F(62, 800);
  x.fillText("WREXHAM", 80, 250);
  x.fillText(m.opponent.toUpperCase().slice(0, 22), 80, 400);

  x.font = F(96, 800); x.textAlign = "right";
  // only our score carries the result colour; colouring both reads as ambiguous
  x.fillStyle = m.result === "W" ? "#2ea043" : m.result === "L" ? "#e0242f" : "#8b929e";
  x.fillText(String(m.us), W - 90, 255);
  x.fillStyle = "#e9ecf1";
  x.fillText(String(m.them), W - 90, 405);
  x.textAlign = "left";

  x.fillStyle = "#8b929e"; x.font = F(26, 700);
  x.fillText(m.home ? "at the Racecourse Ground" : "away", 80, 470);
  x.fillStyle = "#e0242f"; x.font = F(24, 700);
  x.fillText("danpune.github.io/wrexham-tracker", 80, 552);

  c.toBlob(blob => {
    if (!blob) return;
    const file = new File([blob], "wrexham-result.png", {type: "image/png"});
    if (navigator.canShare && navigator.canShare({files: [file]})){
      navigator.share({files: [file], title: "Wrexham", text: `Wrexham ${m.us}-${m.them} ${m.opponent}`})
        .catch(() => {});                                  // user dismissed the sheet
    } else {
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = "wrexham-result.png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 6000);
    }
  }, "image/png");
}

function squad(d){
  const POS = {G: "Goalkeepers", D: "Defenders", M: "Midfielders", F: "Forwards"};
  let html = "", seen = "";
  for (const p of d.squad){
    if (p.pos !== seen){ html += `<div class="mnth">${POS[p.pos] || "Squad"}</div>`; seen = p.pos; }
    html += `<div class="mrow"><div class="mdate" style="width:30px;flex:0 0 30px"><b>${esc(String(p.no)) || "&ndash;"}</b></div>
      <div class="mopp">${esc(p.name)}</div>
      ${p.age ? `<div class="mres" style="font-size:12px;color:var(--mut)">${esc(String(p.age))}</div>` : ""}</div>`;
  }
  $("#squad").innerHTML = html || "<div class='skel'>Squad unavailable.</div>";
}

function news(d){
  $("#news").innerHTML = (d.news.length ? "" : "<div class='skel'>No news right now.</div>") + d.news.map(n => `<a class="item" href="${esc(n.url)}" target="_blank" rel="noopener">
    <div class="meta"><span class="src">${esc(n.source)}</span><span>${ago(n.published)}</span></div>
    <h3>${esc(n.title)}</h3></a>`).join("");
}

function pods(d){
  $("#pods").innerHTML = (d.podcasts.length ? "" : "<div class='skel'>No episodes right now.</div>") + d.podcasts.map(p => `<div class="item">
    <div class="meta"><span class="src">${esc(p.show)}</span><span>${ago(p.published)}</span></div>
    <h3>${esc(p.title)}</h3>
    ${p.audio ? `<audio controls preload="none" src="${esc(p.audio)}" aria-label="Play: ${esc(p.title)}"></audio>`
              : `<p><a href="${esc(p.url)}" target="_blank" rel="noopener">Listen on BBC Sounds &rarr;</a></p>`}
  </div>`).join("");
}

  const when = new Date(d.updated).toLocaleString("en-GB", {...UK, dateStyle:"medium", timeStyle:"short"});
  $("#info").innerHTML = `

    <div class="links">
      <a href="https://www.wrexhamafc.co.uk/" target="_blank" rel="noopener noreferrer">Official website</a>

      <a href="https://www.instagram.com/wrexham_afc" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a href="https://www.youtube.com/@WxmAFCofficial" target="_blank" rel="noopener noreferrer">YouTube</a>

    </div></div>

  <div class="card" style="margin-top:10px"><h2>Where the numbers come from</h2>
    <div class="note" style="margin-top:8px">
      <b>Fixtures, table, match stats, squad, TV</b> &mdash; <a href="https://www.espn.co.uk/football/team/_/id/352/wrexham" target="_blank" rel="noopener noreferrer">ESPN</a>'s public feed (league, EFL Cup, FA Cup).<br>
      <b>News</b> &mdash; <a href="https://news.google.com/search?q=Wrexham%20AFC" target="_blank" rel="noopener noreferrer">Google News</a> RSS.<br>

      <b>Kickoff weather</b> &mdash; <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a>, for the venue city.<br>
      The refresh job is scheduled every 30 minutes, but GitHub skips slots when it is busy &mdash; in practice updates land a few times a day. The timestamp is the truth: last update <b>${esc(when)}</b> UK.</div></div>

  <div class="card" style="margin-top:10px"><h2>What the projection is and isn't</h2>

// title= covers desktop hover; phones need a tap, so mirror it into a tooltip
(() => {
  const tip = $("#tip");
  const show = el => {
    tip.textContent = el.dataset.t;
    tip.classList.add("on");
    const r = el.getBoundingClientRect(), w = tip.offsetWidth;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
    tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + "px";
  };
  const hide = () => tip.classList.remove("on");
  document.addEventListener("click", e => {
    const p = e.target.closest("[data-t]");
    p ? show(p) : hide();
  });
  document.addEventListener("focusin", e => {
    const p = e.target.closest("[data-t]"); if (p) show(p);
  });
  document.addEventListener("focusout", hide);
  addEventListener("scroll", hide, {passive: true});
})();

tabs();

function initTZ(d){
  const sel = $("#tz"); if (!sel) return;
  sel.innerHTML = TZ_OPTS.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("");
  let saved = "__device__";
  try { saved = localStorage.getItem("wxm-tz") || "__device__"; } catch (e) {}
  sel.value = TZ_OPTS.some(o => o[0] === saved) ? saved : "__device__";
  sel.onchange = () => {
    TZ = sel.value === "__device__" ? DEVICE_TZ : sel.value;
    try { localStorage.setItem("wxm-tz", sel.value); } catch (e) {}
    hero(d); fixtures(d);          // the only panels that render a clock
  };
}

fetch("data.json").then(r => r.json()).then(d => {
  $("#comp").textContent = d.competition + " " + d.season;
  const lg = d.matches.filter(m => m.comp === "League");   // cups don't belong in league progress
  const done = lg.filter(m => m.completed || m.awaitingResult).length, total = lg.length;
  $("#prog").textContent = `${done} played \u00b7 ${total - done} to go`;
  const res = lg.filter(m => m.completed && m.result).map(m => m.result);
  let streak = "";
  if (res.length){
    const back = res.slice().reverse(), last = back[0];
    let n = 0; while (n < back.length && back[n] === last) n++;
    const sinceLoss = back.findIndex(x => x === "L");
    streak = last === "W" ? (n > 1 ? `${n} wins in a row` : "Won last time out")
           : last === "L" ? (res.includes("W") ? "Bounce-back time" : "Still chasing a first win")
           : `Unbeaten in ${sinceLoss === -1 ? res.length : sinceLoss}`;
  }
  $("#streak").textContent = streak;
  $("#sbarfill").style.width = (done / total * 100) + "%";
  // One failing panel must not blank the other seven.
  for (const [name, fn] of [["hero",hero],["fixtures",fixtures],["table",table],["centre",centre],
                            ["promo",promo],["stand",standing],["squad",squad],["news",news],["pods",pods]]){
    try { fn(d); }
    catch (err) {
      console.error(name + " failed", err);
      // hero has no panel of its own; surface its failure in the tab that is open
      const el = $("#" + (name === "hero" ? "table" : name));
      if (el && !el.innerHTML) el.innerHTML = "<div class='skel'>This section couldn&rsquo;t load.</div>";
    }
  }
  info(d);
  initTZ(d);
  // Delegated: both controls are rebuilt whenever a different match is picked.
  $("#centre").addEventListener("click", e => {
    if (e.target.closest("#sharebtn")) return shareResult(d);
    const ph = e.target.closest(".ytph[data-yt]");
    if (ph) ph.outerHTML = `<iframe class="yt" src="https://www.youtube-nocookie.com/embed/`
      + encodeURIComponent(ph.dataset.yt) + `" title="Match highlights" allowfullscreen></iframe>`;
  });
  $("#stamp").textContent = "Updated " + ago(d.updated);
}).catch(() => { $("#fixtures").innerHTML = "<div class='skel'>Couldn&rsquo;t load data. Try a refresh.</div>"; });
</script>
