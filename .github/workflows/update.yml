name: Update Wrexham data

on:
  schedule:
    - cron: "13,43 * * * *"   # every 30 min at :13/:43 — odd minutes dodge GitHub's
                              # congested :00/:30 slots where low-traffic crons get skipped
  workflow_dispatch:
  repository_dispatch:          # external kick, in case the schedule above never fires
    types: [refresh]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # a hung job otherwise runs to GitHub's 360-minute default
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6 (SHA-pinned)
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6 (SHA-pinned)
        with:
          python-version: "3.12"

      - name: Self-check
        run: python test_fetch.py

      - name: Fetch data
        run: python fetch_data.py

      - name: Fill official highlights (fail-safe — merge-only, ok if YouTube blocks CI)
        run: python build_highlights.py || true

      # Keeps the WhatsApp/iMessage link preview showing the current result and
      # next fixture. Fonts resolve to DejaVu here; the script only writes when
      # the pixels change, so a quiet run commits nothing.
      - name: Refresh the share card
        run: |
          python -m pip install --quiet pillow
          python build_assets.py --card || true

      - name: Commit if changed
        run: |
          git config user.name  "wxm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data.json league.json archive highlights.json ics preview.jpg
          git diff --staged --quiet || git commit -m "Update data $(date -u +%FT%TZ)"
          # GitHub occasionally answers a push with "fatal error in commit_refs"
          # (1 run in 30). The data is fine and the next cron would carry it, but
          # the failed run emails the owner, which trains them to ignore the
          # alerts that matter. Re-rebase each try: the retry may be racing a
          # push that landed in between.
          for i in 1 2 3; do
            if ! git pull --rebase origin main; then
              stage="pull --rebase"
            elif git push; then
              exit 0
            else
              stage="push"
            fi
            git rebase --abort 2>/dev/null || true
            # Name the stage that failed: "push failed" while the PULL was the
            # problem misleads exactly when someone is diagnosing. And do not
            # announce a retry after the last attempt.
            if [ "$i" -lt 3 ]; then
              echo "$stage failed (attempt $i/3); retrying in $((i * 15))s"
              sleep $((i * 15))
            else
              echo "$stage failed on the final attempt"
            fi
          done
          echo "$stage failed three times — this is not a blip"
          exit 1
